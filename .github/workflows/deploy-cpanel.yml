name: Build & Deploy Laravel to cPanel (cPanel-safe, no rsync)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, mysql, curl, dom, fileinfo, openssl, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: |
          set -euxo pipefail
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: Package for deploy (ship vendor, keep server .env + storage)
        run: |
          set -euxo pipefail
          rm -f deploy.tar.gz
          tar -czf /tmp/deploy.tar.gz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="deploy.tar.gz" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="public/storage" \
            --exclude="node_modules" \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.CPANEL_USER }}/tmp-deploy"
          overwrite: true
          timeout: 120s
          command_timeout: 30m
          debug: true

      - name: Extract + overlay copy + verify + migrate (clear diagnostics)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            STAGE_DIR="/home/${{ secrets.CPANEL_USER }}/tmp-deploy"
            RELEASE_DIR="$STAGE_DIR/release"
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"

            echo "== Paths =="
            echo "APP_DIR=$APP_DIR"
            echo "STAGE_DIR=$STAGE_DIR"
            echo "RELEASE_DIR=$RELEASE_DIR"
            echo "PHP_BIN=$PHP_BIN"

            echo "== Check uploaded package =="
            ls -lah "$STAGE_DIR" || true
            test -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Prepare release dir =="
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            echo "== Extract to release dir =="
            tar -xzf "$STAGE_DIR/deploy.tar.gz" -C "$RELEASE_DIR"
            rm -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Verify release looks like Laravel =="
            test -f "$RELEASE_DIR/artisan"
            test -f "$RELEASE_DIR/composer.json"

            echo "== Ensure APP_DIR exists =="
            mkdir -p "$APP_DIR"

            echo "== Ensure server .env exists (must be created on server) =="
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "❌ .env missing at $APP_DIR/.env"
              echo "Create it on server (do NOT commit .env), then re-run."
              exit 1
            fi

            echo "== Overlay copy from release into APP_DIR (protect .env, storage, public/storage) =="
            shopt -s dotglob

            # Copy everything except protected items
            for item in "$RELEASE_DIR"/*; do
              base="$(basename "$item")"
              case "$base" in
                .env|storage)
                  echo "skip $base"
                  ;;
                public)
                  echo "skip public (handled separately)"
                  ;;
                *)
                  cp -a "$item" "$APP_DIR/"
                  ;;
              esac
            done

            # Copy public, but keep public/storage
            if [ -d "$RELEASE_DIR/public" ]; then
              mkdir -p "$APP_DIR/public"
              shopt -s dotglob
              for pitem in "$RELEASE_DIR/public"/*; do
                pbase="$(basename "$pitem")"
                if [ "$pbase" = "storage" ]; then
                  echo "skip public/storage"
                  continue
                fi
                cp -a "$pitem" "$APP_DIR/public/"
              done
            fi

            echo "== Ensure runtime dirs + permissions =="
            mkdir -p "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
            chmod -R ug+rwx "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            cd "$APP_DIR"

            echo "== Confirm vendor exists =="
            if [ ! -f "$APP_DIR/vendor/autoload.php" ]; then
              echo "❌ vendor/autoload.php missing in APP_DIR"
              echo "This deploy ships vendor. If it's missing, DEPLOY_PATH is likely wrong."
              echo "APP_DIR listing:"
              ls -lah "$APP_DIR" | head -n 120
              exit 1
            fi

            echo "== PHP info =="
            "$PHP_BIN" -v

            echo "== Artisan smoke test (print errors) =="
            set +e
            "$PHP_BIN" -d display_errors=1 -d display_startup_errors=1 artisan --version 2>&1
            ART_EXIT=$?
            set -e

            if [ "$ART_EXIT" -ne 0 ]; then
              echo "❌ artisan failed with exit=$ART_EXIT"
              echo "== Latest Laravel logs (if any) =="
              ls -lah storage/logs || true
              tail -n 200 storage/logs/laravel*.log 2>/dev/null || true
              exit "$ART_EXIT"
            fi

            echo "== Clear caches =="
            "$PHP_BIN" artisan optimize:clear || true

            echo "== Run migrations =="
            "$PHP_BIN" artisan migrate --force

            echo "== Rebuild caches =="
            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true

            echo "== Storage link =="
            "$PHP_BIN" artisan storage:link || true

            echo "✅ Deploy complete"
