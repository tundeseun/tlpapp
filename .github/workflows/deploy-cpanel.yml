name: Build & Deploy Laravel to cPanel (safe copy, no deletes)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, mysql, curl, dom, fileinfo, openssl, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: |
          set -euxo pipefail
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package for deploy (ships vendor; excludes runtime storage)
        run: |
          set -euxo pipefail
          rm -f deploy.tar.gz
          tar -czf /tmp/deploy.tar.gz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="deploy.tar.gz" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="public/storage" \
            --exclude="node_modules" \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: Upload package to server (retry)
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euxo pipefail
          echo "$CPANEL_SSH_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

          for i in 1 2 3; do
            echo "== SCP attempt $i =="
            if scp -o StrictHostKeyChecking=no -P "$CPANEL_PORT" -i /tmp/id_rsa deploy.tar.gz "$CPANEL_USER@$CPANEL_HOST:/home/$CPANEL_USER/tmp-deploy/deploy.tar.gz"; then
              echo "✅ Uploaded"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "❌ SCP failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Extract + safe copy + optional artisan
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            STAGE_DIR="/home/${{ secrets.CPANEL_USER }}/tmp-deploy"
            RELEASE_DIR="$STAGE_DIR/release"
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"

            echo "== Validate DEPLOY_PATH =="
            echo "APP_DIR=$APP_DIR"
            if [ -z "${APP_DIR:-}" ]; then
              echo "❌ DEPLOY_PATH is empty"
              exit 1
            fi
            case "$APP_DIR" in
              /*) ;;
              *) echo "❌ DEPLOY_PATH must be an absolute path starting with /"; exit 1 ;;
            esac

            echo "== Stage & extract =="
            mkdir -p "$STAGE_DIR"
            test -f "$STAGE_DIR/deploy.tar.gz"

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$STAGE_DIR/deploy.tar.gz" -C "$RELEASE_DIR"
            rm -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Verify release =="
            test -f "$RELEASE_DIR/artisan"
            test -f "$RELEASE_DIR/vendor/autoload.php"

            echo "== Ensure APP_DIR exists =="
            mkdir -p "$APP_DIR"

            echo "== Safe copy into APP_DIR (NO deletes) =="
            # Copy everything from release into APP_DIR, but NEVER overwrite .env if it exists
            # Also do not touch storage/ and do not touch public/storage
            for item in "$RELEASE_DIR"/*; do
              base="$(basename "$item")"
              if [ "$base" = "storage" ]; then
                echo "skip storage"
                continue
              fi
              if [ "$base" = "public" ]; then
                echo "public handled separately"
                continue
              fi
              if [ "$base" = ".env" ]; then
                echo "skip .env"
                continue
              fi
              cp -a "$item" "$APP_DIR/"
            done

            # Copy public/ but keep public/storage if it exists
            if [ -d "$RELEASE_DIR/public" ]; then
              mkdir -p "$APP_DIR/public"
              for pitem in "$RELEASE_DIR/public"/*; do
                pbase="$(basename "$pitem")"
                if [ "$pbase" = "storage" ]; then
                  echo "skip public/storage"
                  continue
                fi
                cp -a "$pitem" "$APP_DIR/public/"
              done
            fi

            echo "== Ensure runtime dirs =="
            mkdir -p "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
            chmod -R ug+rwx "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            echo "== If .env missing, create a placeholder and skip artisan =="
            if [ ! -f "$APP_DIR/.env" ]; then
              if [ -f "$RELEASE_DIR/.env.example" ]; then
                cp -n "$RELEASE_DIR/.env.example" "$APP_DIR/.env" || true
                chmod 640 "$APP_DIR/.env" || true
                echo "⚠️ .env was missing. I created it from .env.example."
                echo "⚠️ Please edit $APP_DIR/.env with DB credentials and APP_URL, then re-run workflow."
              else
                echo "⚠️ .env missing and .env.example not found. Please create $APP_DIR/.env manually."
              fi
              echo "✅ Files deployed (artisan skipped because env is not confirmed)."
              exit 0
            fi

            echo "== Run artisan (only when .env exists) =="
            cd "$APP_DIR"
            "$PHP_BIN" -v
            "$PHP_BIN" artisan --version

            "$PHP_BIN" artisan optimize:clear || true
            "$PHP_BIN" artisan migrate --force

            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true

            "$PHP_BIN" artisan storage:link || true

            echo "✅ Deploy complete"
