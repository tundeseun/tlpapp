name: Build & Deploy Laravel to cPanel (rsync safe)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, mysql, curl, dom, fileinfo, openssl, tokenizer, xml, zip
          coverage: none

      - name: Install dependencies (prod)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Package for deploy
        run: |
          rm -f deploy.tar.gz
          tar -czf /tmp/deploy.tar.gz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="deploy.tar.gz" \
            --exclude=".env" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/views/*" \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.CPANEL_USER }}/tmp-deploy"

      - name: Extract + rsync + migrate on server (safe)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          script: |
            set -euxo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            STAGE_DIR="/home/${{ secrets.CPANEL_USER }}/tmp-deploy"
            RELEASE_DIR="$STAGE_DIR/release"
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"

            echo "== Paths =="
            echo "APP_DIR=$APP_DIR"
            echo "STAGE_DIR=$STAGE_DIR"
            echo "RELEASE_DIR=$RELEASE_DIR"
            echo "PHP_BIN=$PHP_BIN"

            echo "== Check package uploaded =="
            ls -lah "$STAGE_DIR" || true
            test -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Prepare release dir =="
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            echo "== Extract to release dir (NOT directly to APP_DIR) =="
            tar -xzf "$STAGE_DIR/deploy.tar.gz" -C "$RELEASE_DIR"
            rm -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Verify critical files in release =="
            test -f "$RELEASE_DIR/artisan"
            test -f "$RELEASE_DIR/composer.json"

            echo "== Ensure app dir exists =="
            mkdir -p "$APP_DIR"

            echo "== Rsync into APP_DIR (preserve server .env & storage) =="
            # NOTE: remove --exclude vendor/ if you want vendor updated from GitHub build
            rsync -a --delete \
              --exclude ".env" \
              --exclude "storage/" \
              --exclude "public/storage" \
              --exclude "vendor/" \
              "$RELEASE_DIR/" "$APP_DIR/"

            echo "== Permissions =="
            mkdir -p "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
            chmod -R ug+rwx "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            echo "== Check .env exists on server =="
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "❌ .env is missing at $APP_DIR/.env"
              exit 1
            fi

            cd "$APP_DIR"

            echo "== Artisan test =="
            $PHP_BIN artisan --version

            echo "== Cache refresh =="
            $PHP_BIN artisan config:clear || true
            $PHP_BIN artisan cache:clear || true
            $PHP_BIN artisan route:clear || true
            $PHP_BIN artisan view:clear || true

            echo "== Migrations =="
            $PHP_BIN artisan migrate --force

            echo "== Cache build =="
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            echo "== Storage link =="
            $PHP_BIN artisan storage:link || true

            echo "✅ Deploy complete"
