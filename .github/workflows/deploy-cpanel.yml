name: Build & Deploy Laravel to cPanel (safe sync, debug host/path)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo, mysql, curl, dom, fileinfo, openssl, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: |
          set -euxo pipefail
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package for deploy (ships vendor; excludes runtime storage)
        run: |
          set -euxo pipefail
          rm -f deploy.tar.gz
          tar -czf /tmp/deploy.tar.gz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="deploy.tar.gz" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="public/storage" \
            --exclude="node_modules" \
            .
          mv /tmp/deploy.tar.gz deploy.tar.gz
          ls -lh deploy.tar.gz

      - name: Prepare remote tmp-deploy folder
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euxo pipefail
          echo "$CPANEL_SSH_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

          ssh -o StrictHostKeyChecking=no -p "$CPANEL_PORT" -i /tmp/id_rsa \
            "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p /home/$CPANEL_USER/tmp-deploy"

      - name: Upload package to server (retry)
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euxo pipefail
          echo "$CPANEL_SSH_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

          for i in 1 2 3; do
            echo "== SCP attempt $i =="
            if scp -o StrictHostKeyChecking=no -P "$CPANEL_PORT" -i /tmp/id_rsa \
              deploy.tar.gz "$CPANEL_USER@$CPANEL_HOST:/home/$CPANEL_USER/tmp-deploy/deploy.tar.gz"; then
              echo "✅ Uploaded"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "❌ SCP failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Extract + safe sync + debug + optional artisan
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT }}
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            CPANEL_USER="${{ secrets.CPANEL_USER }}"
            STAGE_DIR="/home/${CPANEL_USER}/tmp-deploy"
            RELEASE_DIR="${STAGE_DIR}/release"
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"

            echo "===================================="
            echo "🚀 DEPLOY DEBUG INFO"
            echo "Connected host: ${{ secrets.CPANEL_HOST }}"
            echo "Connected user: ${CPANEL_USER}"
            echo "Server hostname: $(hostname)"
            echo "Server IP: $(hostname -I || echo 'N/A')"
            echo "whoami: $(whoami)"
            echo "HOME: $HOME"
            echo "PWD: $(pwd)"
            echo "DEPLOY_PATH(APP_DIR): $APP_DIR"
            echo "===================================="

            echo "== Validate DEPLOY_PATH =="
            if [ -z "${APP_DIR:-}" ]; then
              echo "❌ DEPLOY_PATH is empty"
              exit 1
            fi
            case "$APP_DIR" in
              /*) ;;
              *) echo "❌ DEPLOY_PATH must be an absolute path starting with /"; exit 1 ;;
            esac

            echo "== Stage & extract =="
            mkdir -p "$STAGE_DIR"
            test -f "$STAGE_DIR/deploy.tar.gz"

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$STAGE_DIR/deploy.tar.gz" -C "$RELEASE_DIR"
            rm -f "$STAGE_DIR/deploy.tar.gz"

            echo "== Verify release =="
            test -f "$RELEASE_DIR/artisan"
            test -f "$RELEASE_DIR/vendor/autoload.php"

            echo "== Ensure APP_DIR exists =="
            mkdir -p "$APP_DIR"

            echo "== List APP_DIR BEFORE sync =="
            ls -la "$APP_DIR" || true

            echo "== Enable dotfiles in globs =="
            shopt -s dotglob nullglob

            echo "== Fix file/dir collisions (pre-sync) =="
            for item in "$RELEASE_DIR"/*; do
              base="$(basename "$item")"

              [ "$base" = "storage" ] && continue
              [ "$base" = "public" ] && continue
              [ "$base" = ".env" ] && continue

              src="$item"
              dst="$APP_DIR/$base"

              if [ -d "$src" ] && [ -f "$dst" ]; then
                echo "collision: dst file but src dir => rm $dst"
                rm -f "$dst"
              fi
              if [ -f "$src" ] && [ -d "$dst" ]; then
                echo "collision: dst dir but src file => rm -rf $dst"
                rm -rf "$dst"
              fi
            done

            echo "== Safe sync into APP_DIR (NO deletes) =="
            if command -v rsync >/dev/null 2>&1; then
              rsync -a \
                --exclude ".env" \
                --exclude "storage/" \
                --exclude "public/" \
                "$RELEASE_DIR/" "$APP_DIR/"
            else
              echo "⚠️ rsync not found; fallback to cp -a"
              for item in "$RELEASE_DIR"/*; do
                base="$(basename "$item")"
                [ "$base" = "storage" ] && continue
                [ "$base" = "public" ] && continue
                [ "$base" = ".env" ] && continue
                cp -a "$item" "$APP_DIR/"
              done
            fi

            echo "== Sync public/ (keep public/storage) =="
            mkdir -p "$APP_DIR/public"

            if [ -d "$RELEASE_DIR/public" ]; then
              for pitem in "$RELEASE_DIR/public"/*; do
                pbase="$(basename "$pitem")"
                [ "$pbase" = "storage" ] && continue

                src="$pitem"
                dst="$APP_DIR/public/$pbase"

                if [ -d "$src" ] && [ -f "$dst" ]; then
                  echo "public collision: dst file but src dir => rm $dst"
                  rm -f "$dst"
                fi
                if [ -f "$src" ] && [ -d "$dst" ]; then
                  echo "public collision: dst dir but src file => rm -rf $dst"
                  rm -rf "$dst"
                fi
              done

              if command -v rsync >/dev/null 2>&1; then
                rsync -a --exclude "storage/" "$RELEASE_DIR/public/" "$APP_DIR/public/"
              else
                echo "⚠️ rsync not found; fallback cp -a for public"
                for pitem in "$RELEASE_DIR/public"/*; do
                  pbase="$(basename "$pitem")"
                  [ "$pbase" = "storage" ] && continue
                  cp -a "$pitem" "$APP_DIR/public/"
                done
              fi
            fi

            echo "== Ensure runtime dirs =="
            mkdir -p "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
            chmod -R ug+rwx "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            echo "== Write deploy marker file =="
            echo "Deployed at: $(date)" > "$APP_DIR/deploy-check.txt"
            echo "Host: $(hostname)" >> "$APP_DIR/deploy-check.txt"
            echo "User: $(whoami)" >> "$APP_DIR/deploy-check.txt"
            echo "APP_DIR: $APP_DIR" >> "$APP_DIR/deploy-check.txt"

            echo "== List APP_DIR AFTER sync =="
            ls -la "$APP_DIR" || true
            echo "== Marker file content =="
            cat "$APP_DIR/deploy-check.txt" || true

            echo "== If .env missing, create placeholder and skip artisan =="
            if [ ! -f "$APP_DIR/.env" ]; then
              if [ -f "$RELEASE_DIR/.env.example" ]; then
                cp -n "$RELEASE_DIR/.env.example" "$APP_DIR/.env" || true
                chmod 640 "$APP_DIR/.env" || true
                echo "⚠️ .env was missing. Created from .env.example. Please edit it and rerun."
              else
                echo "⚠️ .env missing and .env.example not found. Please create $APP_DIR/.env manually."
              fi
              echo "✅ Files deployed (artisan skipped)."
              exit 0
            fi

            echo "== Run artisan (only when .env exists) =="
            cd "$APP_DIR"
            "$PHP_BIN" -v || true
            "$PHP_BIN" artisan --version || true

            "$PHP_BIN" artisan optimize:clear || true
            "$PHP_BIN" artisan migrate --force || true
            "$PHP_BIN" artisan config:cache || true
            "$PHP_BIN" artisan route:cache || true
            "$PHP_BIN" artisan view:cache || true
            "$PHP_BIN" artisan storage:link || true

            echo "✅ Deploy complete"
