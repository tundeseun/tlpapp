name: Build & Deploy Laravel to cPanel

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP (8.2)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo, mysql, curl, dom, fileinfo, openssl, tokenizer, xml, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # If you use Laravel caches, it's fine to build them on server, not here.

      - name: Create deploy artifact
        run: |
          tar --exclude=".git" --exclude=".github" -czf deploy.tar.gz .

      - name: Copy artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/${{ secrets.CPANEL_USER }}/tmp-deploy"

      - name: Deploy on server (extract + migrate)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            STAGE_DIR="/home/${{ secrets.CPANEL_USER }}/tmp-deploy"

            mkdir -p "$APP_DIR"

            echo "== Extract deploy package =="
            cd "$STAGE_DIR"
            tar -xzf deploy.tar.gz -C "$APP_DIR"
            rm -f deploy.tar.gz

            echo "== Permissions =="
            chmod -R ug+rwx "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" || true

            # Use whichever php CLI works on your server for artisan.
            # Your earlier php -v shows 8.1.33; artisan may still run, but Laravel 12 expects 8.2+.
            # Let's try ea-php83 first if available, otherwise fall back to system php.
            if [ -x /opt/cpanel/ea-php83/root/usr/bin/php ]; then
              PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"
            elif [ -x /opt/cpanel/ea-php82/root/usr/bin/php ]; then
              PHP_BIN="/opt/cpanel/ea-php82/root/usr/bin/php"
            else
              PHP_BIN="php"
            fi

            echo "Using PHP: $PHP_BIN"
            cd "$APP_DIR"

            echo "== Clear & cache (server) =="
            $PHP_BIN artisan config:clear || true
            $PHP_BIN artisan cache:clear || true
            $PHP_BIN artisan route:clear || true
            $PHP_BIN artisan view:clear || true
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            echo "== Run migrations =="
            $PHP_BIN artisan migrate --force

            echo "== Storage link =="
            $PHP_BIN artisan storage:link || true

            echo "✅ Deploy complete"
